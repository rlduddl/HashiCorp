  #     Protocol: HTTP
  #     VpcId: !Ref VPC1

  # =========================
  # ALB Listener
  # =========================
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTG1

