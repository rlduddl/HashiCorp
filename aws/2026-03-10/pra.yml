Parameters:

  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: must be the name of an existing EC2 KeyPair.

  LatestAmiTd:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

# =========================
# VPC
# =========================
  VPC1:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.1.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC1

  TESTVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 20.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: TESTVPC

# =========================
# Internet Gateway
# =========================
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: VPC1-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC1
      InternetGatewayId: !Ref InternetGateway

  TestInternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachTestGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref TESTVPC
      InternetGatewayId: !Ref TestInternetGateway

# =========================
# Subnets
# =========================
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC1
      CidrBlock: 10.1.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: PublicSubnet1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC1
      CidrBlock: 10.1.2.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: Name
          Value: PublicSubnet2

  TestPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TESTVPC
      CidrBlock: 20.0.0.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: TestPublicSubnet

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC1
      CidrBlock: 10.1.3.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: PrivateSubnet1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC1
      CidrBlock: 10.1.4.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: Name
          Value: PrivateSubnet2

# =========================
# Route Tables
# =========================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC1

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable


  TestPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TESTVPC

  TestPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachTestGateway
    Properties:
      RouteTableId: !Ref TestPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref TestInternetGateway

  TestPublicSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TestPublicSubnet
      RouteTableId: !Ref TestPublicRouteTable

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC1


  PrivateSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

# =========================
# Security Groups
# =========================
  NATSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: NAT Instance SG
      VpcId: !Ref VPC1
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 10.1.0.0/16

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.1.0.0/16



  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private Web SG
      VpcId: !Ref VPC1
      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          # SourceSecurityGroupId: !Ref ALBSecurityGroup
          CidrIp: 10.1.0.0/16

        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.1.0.0/16

        - IpProtocol: icmp #ping용
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB Security Group
      VpcId: !Ref VPC1
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  TestWebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Test VPC Web SG
      VpcId: !Ref TESTVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

# 동적 조정 정책

  ASGPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref ASG1
      PolicyType: TargetTrackingScaling
      PolicyName: Scale-Out-Policy
      TargetTrackingConfiguration:
        PredefinedMetricType: ASGAverageCPUUtilization
      TargetValue: 50
      DisableScaleIn: true

  ScaleInSimplePolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref ASG1
      PolicyType: SimpleScaling
      PolicyName: Scale-In-Policy
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: -1
      Cooldown: 60

  LowCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: 'CPU <= threshold -> scale in'
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref ASG1
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 10
      ComparisonOperator: LessThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !GetAtt ScaleInSimplePolicy.Arn
# =========================
# NAT Instance ENI
# =========================
  NatENI1:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref PublicSubnet1
      GroupSet:
        - !Ref NATSecurityGroup
      PrivateIpAddress: 10.1.1.100

  NatENI2:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref PublicSubnet2
      GroupSet:
        - !Ref NATSecurityGroup
      PrivateIpAddress: 10.1.2.100

# =========================
# Elastic IP
# =========================
  NatEIP1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatEIP2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatEIPAssociation1:
    Type: AWS::EC2::EIPAssociation
    DependsOn: NATInstance1
    Properties:
      AllocationId: !GetAtt NatEIP1.AllocationId
      NetworkInterfaceId: !Ref NatENI1

  NatEIPAssociation2:
    Type: AWS::EC2::EIPAssociation
    DependsOn: NATInstance2
    Properties:
      AllocationId: !GetAtt NatEIP2.AllocationId
      NetworkInterfaceId: !Ref NatENI2


# 테스트 vpc ec2
  TestInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0389ea382ca31bd7f
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: Test-EC2
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref TestPublicSubnet
          GroupSet:
            - !Ref TestWebSecurityGroup
          AssociatePublicIpAddress: true #ip만듬
      UserData:
              Fn::Base64:
                !Sub |
                  #!/bin/bash
                  dnf install net-snmp-utils httpd-tools -y
                  cat <<'EOT' >> /etc/profile.d/prompt.sh
                  export PS1="\[\e[1;31m\]\u\[\e[m\]@\[\e[1;32m\]\h\[\e[m\]: \[\e[1;36m\]\w\[\e[m\]\$ "
                  EOT
                  source /etc/profile

# =========================
# NAT Instance
# =========================
  NATInstance1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0389ea382ca31bd7f
      KeyName: !Ref KeyName
      SourceDestCheck: false
      Tags:
        - Key: Name
          Value: Test-Instance1
      NetworkInterfaces:
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref NatENI1
      UserData:
              Fn::Base64: |
                #!/bin/bash
                hostname Seoul-AWS-NATInstance1
                cat <<EOT > /etc/profile.d/prompt.sh
                export PS1="[\[\e[1;31m\]\u\[\e[m\]@\[\e[1;32m\]\h\[\e[m\]: \[\e[1;36m\]\w\[\e[m\]]#"
                EOT
                source /etc/profile
                set -euxo pipefail
                #Egress 인터페이스 자동 추출
                IFACE="$(ip route show default | awk '/default/ {print $5; exit}')"
                #iptables 서비스 설치/활성화
                dnf install -y iptables-services
                systemctl enable --now iptables
                #IP 포워딩 상시 활성화
                cat >/etc/sysctl.d/90-nat.conf <<'EOF'
                net.ipv4.ip_forward=1
                EOF
                sysctl --system
                #NAT 규칙 초기화 및 설정
                /sbin/iptables -t nat -F
                /sbin/iptables -F FORWARD
                /sbin/iptables -P FORWARD ACCEPT
                /sbin/iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE
                #규칙 영구 저장
                service iptables save

  NATInstance2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0389ea382ca31bd7f
      KeyName: !Ref KeyName
      SourceDestCheck: false
      Tags:
        - Key: Name
          Value: Test-Instance2
      NetworkInterfaces:
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref NatENI2
      UserData:
              Fn::Base64: |
                #!/bin/bash
                hostname Seoul-AWS-NATInstance2
                cat <<EOT > /etc/profile.d/prompt.sh
                export PS1="[\[\e[1;31m\]\u\[\e[m\]@\[\e[1;32m\]\h\[\e[m\]: \[\e[1;36m\]\w\[\e[m\]]#"
                EOT
                source /etc/profile
                set -euxo pipefail
                #Egress 인터페이스 자동 추출
                IFACE="$(ip route show default | awk '/default/ {print $5; exit}')"
                #iptables 서비스 설치/활성화
                dnf install -y iptables-services
                systemctl enable --now iptables
                #IP 포워딩 상시 활성화
                cat >/etc/sysctl.d/90-nat.conf <<'EOF'
                net.ipv4.ip_forward=1
                EOF
                sysctl --system
                #NAT 규칙 초기화 및 설정
                /sbin/iptables -t nat -F
                /sbin/iptables -F FORWARD
                /sbin/iptables -P FORWARD ACCEPT
                /sbin/iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE
                #규칙 영구 저장
                service iptables save


