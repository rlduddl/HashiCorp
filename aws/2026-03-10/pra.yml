  # =========================
  # ALB
  # =========================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Name: VPC1-Seoul-AWS-ALB
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2


  # =========================
  # ALB Target Group
  # =========================
  ALBTG1:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    # DependsOn: WebServer2
    Properties:
      Name: ALBTG1
      Port: 80
      Protocol: HTTP
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      VpcId: !Ref VPC1
      # Targets:
      #   - Id: !Ref WebServer1
      #     Port: 80
      #   - Id: !Ref WebServer2
      #     Port: 80
      Tags:
        - Key: Name
          Value: VPC1-Seoul-AWS-ALBTG


  # ALBTG2:
  #   Type: AWS::ElasticLoadBalancingV2::TargetGroup
  #   Properties:
  #     Name: ALBTG2
  #     Port: 80
  #     Protocol: HTTP
  #     VpcId: !Ref VPC1

  # ALBTG3:
