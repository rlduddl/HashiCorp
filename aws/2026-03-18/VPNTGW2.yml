Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: must be the name of an existing EC2 KeyPair.

  LatestAmiTd:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

# =========================================================
# VPC
# =========================================================
  IDCVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.60.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: IDC-VPC

  AWSVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: AWS-VPC

# =========================================================
# Internet Gateways
# =========================================================
  IDCIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: IDC-IGW

  AWSIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: AWS-IGW

  IDCIGWAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref IDCVPC
      InternetGatewayId: !Ref IDCIGW

  AWSIGWAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref AWSVPC
      InternetGatewayId: !Ref AWSIGW

# =========================================================
# Subnets
# =========================================================
  IDCPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref IDCVPC
      CidrBlock: 10.60.0.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: IDC-Public-Subnet

  IDCPrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref IDCVPC
      CidrBlock: 10.60.1.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: IDC-Private-Subnet

  AWSPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AWSVPC
      CidrBlock: 10.50.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: AWS-Public-Subnet

  AWSAttachSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AWSVPC
      CidrBlock: 10.50.2.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: AWS-Attach-Subnet

# =========================================================
# Route Tables
# =========================================================
  IDCPublicRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IDCVPC
      Tags:
        - Key: Name
          Value: IDC-Public-RT

  IDCPrivateRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IDCVPC
      Tags:
        - Key: Name
          Value: IDC-Private-RT

  AWSRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AWSVPC
      Tags:
        - Key: Name
          Value: AWS-Public-RT

  AWSAttachRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AWSVPC
      Tags:
        - Key: Name
          Value: AWS-Attach-RT

  IDCDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IDCIGWAttach
    Properties:
      RouteTableId: !Ref IDCPublicRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IDCIGW

  AWSDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AWSIGWAttach
    Properties:
      RouteTableId: !Ref AWSRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref AWSIGW

  IDCPublicAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IDCPublicSubnet
      RouteTableId: !Ref IDCPublicRT

  IDCPrivateAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IDCPrivateSubnet
      RouteTableId: !Ref IDCPrivateRT

  AWSSubnetAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AWSPublicSubnet
      RouteTableId: !Ref AWSRT

  AWSSubnetAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AWSAttachSubnet
      RouteTableId: !Ref AWSAttachRT

# =========================================================
# Security Groups
# =========================================================
  IDCInstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: IDC SG
      VpcId: !Ref IDCVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 500
          ToPort: 500
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 4500
          ToPort: 4500
          CidrIp: 0.0.0.0/0
        - IpProtocol: "50"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: IDC-Instance-SG

  AWSInstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AWS EC2 SG
      VpcId: !Ref AWSVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 10.60.0.0/16
      Tags:
        - Key: Name
          Value: AWS-Instance-SG

# =========================================================
# Elastic IP (IDC CGW)
# =========================================================
  IDCEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: IDC-CGW-EIP

# =========================================================
# EC2 Instances
# =========================================================
  IDCCGW:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      KeyName: !Ref KeyName
      ImageId: ami-06b18c6a9a323f75f
      SubnetId: !Ref IDCPublicSubnet
      PrivateIpAddress: 10.60.0.100
      SourceDestCheck: false
      SecurityGroupIds:
        - !Ref IDCInstanceSG
      Tags:
        - Key: Name
          Value: IDC-CGW
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo "net.ipv4.ip_forward = 1" >> /etc/sysctl.conf
          sysctl -p

  IDCElasticIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt IDCEIP.AllocationId
      InstanceId: !Ref IDCCGW

  IDCPrivateEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      ImageId: !Ref LatestAmiTd
      SubnetId: !Ref IDCPrivateSubnet
      PrivateIpAddress: 10.60.1.100
      SecurityGroupIds:
        - !Ref IDCInstanceSG
      Tags:
        - Key: Name
          Value: IDC-EC2

  AWSEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      ImageId: !Ref LatestAmiTd
      SubnetId: !Ref AWSPublicSubnet
      PrivateIpAddress: 10.50.1.100
      SecurityGroupIds:
        - !Ref AWSInstanceSG
      Tags:
        - Key: Name
          Value: AWS-EC2

# =========================================================
# TGW (simple mode: default route table behavior)
# =========================================================
  TransitGateway1:
    Type: AWS::EC2::TransitGateway
    Properties:
      AmazonSideAsn: 64512
      Tags:
        - Key: Name
          Value: TGW1

  TransitGatewayAtt1:
    Type: AWS::EC2::TransitGatewayAttachment
    DependsOn: AWSVPC
    Properties:
      VpcId: !Ref AWSVPC
      SubnetIds:
        - !Ref AWSAttachSubnet
      TransitGatewayId: !Ref TransitGateway1
      Tags:
        - Key: Name
          Value: TGW1-ATT1-AWSVPC

# =========================================================
# AWS VPC Routes to IDC via TGW
# =========================================================
  AWSVPCRoutePublic:
    Type: AWS::EC2::Route
    DependsOn: TransitGatewayAtt1
    Properties:
      RouteTableId: !Ref AWSRT
      DestinationCidrBlock: 10.60.0.0/16
      TransitGatewayId: !Ref TransitGateway1

  AWSVPCRouteAttach:
    Type: AWS::EC2::Route
    DependsOn: TransitGatewayAtt1
    Properties:
      RouteTableId: !Ref AWSAttachRT
      DestinationCidrBlock: 10.60.0.0/16
      TransitGatewayId: !Ref TransitGateway1

# =========================================================
# Customer Gateway + VPN to TGW
# =========================================================
  IDCCustomerGateway:
    Type: AWS::EC2::CustomerGateway
    Properties:
      BgpAsn: 65010
      IpAddress: !Ref IDCEIP
      Type: ipsec.1
      Tags:
        - Key: Name
          Value: IDC-CGW

  TGWVPNConnection:
    Type: AWS::EC2::VPNConnection
    Properties:
      Type: ipsec.1
      StaticRoutesOnly: false
      CustomerGatewayId: !Ref IDCCustomerGateway
      TransitGatewayId: !Ref TransitGateway1
      VpnTunnelOptionsSpecifications:
        - PreSharedKey: cloudneta
          TunnelInsideCidr: 169.254.178.132/30
        - PreSharedKey: cloudneta
          TunnelInsideCidr: 169.254.154.168/30
      Tags:
        - Key: Name
          Value: IDC-to-TGW-VPN

Outputs:
  IDCCGWEIP:
    Value: !Ref IDCEIP
    Description: IDC-CGW public EIP (use as LEFTID_FQDN_OR_IP)

  TransitGatewayId:
    Value: !Ref TransitGateway1
    Description: Transit Gateway ID

  AWSVPCAttachmentId:
    Value: !Ref TransitGatewayAtt1
    Description: AWS VPC TGW Attachment ID

  VPNConnectionId:
    Value: !Ref TGWVPNConnection
    Description: VPN Connection ID

  Tunnel1InsideCidr:
    Value: 169.254.178.132/30
    Description: AWS tunnel1 inside CIDR

  Tunnel2InsideCidr:
    Value: 169.254.154.168/30
    Description: AWS tunnel2 inside CIDR

  PSK:
    Value: cloudneta
    Description: Pre-shared key used for both tunnels