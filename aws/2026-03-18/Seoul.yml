AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Seoul Region Base Stack.
  Includes VPC, IGW, public subnet, TGW attach subnet, EC2, TGW, VPC attachment,
  and TGW peering request to Singapore TGW.
  Public RT is designed with 3 routes:
  local, default to IGW, remote VPC CIDR to TGW.
  TGW static route for peering is left commented for later update after peering acceptance.

Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access to the instances
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: must be the name of an existing EC2 KeyPair.

  SingaporeTGW:
    Description: Singapore TGW ID (tgw-xxxxxxxx)
    Type: String

  LatestAmiId:
    Description: DO NOT CHANGE
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
    AllowedValues:
      - /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64

Resources:

# =========================================================
# VPC
# =========================================================
  SeoulVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.1.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: Seoul-VPC

# =========================================================
# Internet Gateway
# =========================================================
  SeoulIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: Seoul-IGW

  SeoulIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref SeoulIGW
      VpcId: !Ref SeoulVPC

# =========================================================
# Public Route Table
# =========================================================
  SeoulPublicRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SeoulVPC
      Tags:
        - Key: Name
          Value: Seoul-Public-RT

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: SeoulIGWAttachment
    Properties:
      RouteTableId: !Ref SeoulPublicRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref SeoulIGW

# =========================================================
# Public Subnet
# =========================================================
  SeoulPublicSN:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SeoulVPC
      AvailabilityZone: ap-northeast-2a
      CidrBlock: 10.1.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Seoul-Public-SN

  SeoulPublicSNRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SeoulPublicRT
      SubnetId: !Ref SeoulPublicSN

# =========================================================
# Security Group
# =========================================================
  SeoulSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP, SSH, ICMP
      VpcId: !Ref SeoulVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Seoul-EC2-SG

# =========================================================
# EC2
# =========================================================
  SeoulPublicEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: Seoul-Public-EC2
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref SeoulPublicSN
          GroupSet:
            - !Ref SeoulSecurityGroup
          PrivateIpAddress: 10.1.1.10
          AssociatePublicIpAddress: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          hostnamectl --static set-hostname Seoul-EC2
          cat <<'EOT' >> /etc/profile.d/prompt.sh
          export PS1="[\[\e[1;31m\]\u\[\e[m\]@\[\e[1;32m\]\h\[\e[m\]: \[\e[1;36m\]\w\[\e[m\]]#"
          EOT
          source /etc/profile

# =========================================================
# TGW Attachment Subnet
# =========================================================
  SeoulTGWAttachRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SeoulVPC
      Tags:
        - Key: Name
          Value: TGW-SeoulVPC-TGWAttachRT

  SeoulTGWAttachSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SeoulVPC
      AvailabilityZone: ap-northeast-2a
      CidrBlock: 10.1.2.0/24
      Tags:
        - Key: Name
          Value: TGW-SeoulVPC-Subnet2

  SeoulTGWAttachSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SeoulTGWAttachRT
      SubnetId: !Ref SeoulTGWAttachSubnet

# =========================================================
# Transit Gateway
# =========================================================
  TransitGateway1:
    Type: AWS::EC2::TransitGateway
    Properties:
      Tags:
        - Key: Name
          Value: TGW1

  TransitGatewayAtt1:
    Type: AWS::EC2::TransitGatewayAttachment
    DependsOn: SeoulVPC
    Properties:
      VpcId: !Ref SeoulVPC
      SubnetIds:
        - !Ref SeoulTGWAttachSubnet
      TransitGatewayId: !Ref TransitGateway1
      Tags:
        - Key: Name
          Value: TGW1-ATT1-SeoulVPC

# =========================================================
# VPC Route to Singapore via TGW
# 처음 설계부터 포함
# =========================================================
  SeoulRouteToSingapore:
    Type: AWS::EC2::Route
    DependsOn: TransitGatewayAtt1
    Properties:
      RouteTableId: !Ref SeoulPublicRT
      DestinationCidrBlock: 10.2.0.0/16
      TransitGatewayId: !Ref TransitGateway1

# =========================================================
# TGW Peering Request to Singapore
# =========================================================
  SeoulSingaporePeering:
    Type: AWS::EC2::TransitGatewayPeeringAttachment
    Properties:
      PeerAccountId: "236052538859"
      PeerRegion: ap-southeast-1
      PeerTransitGatewayId: !Ref SingaporeTGW
      TransitGatewayId: !Ref TransitGateway1
      Tags:
        - Key: Name
          Value: Seoul-Singapore-TGW-Peering

# =========================================================
# Later update after peering acceptance
# 1) Singapore 리전에서 peering 수락
# 2) 서울 TGW Route Table ID 확인
# 3) 아래 주석 해제 후 업데이트
# TGW peering은 static route only
# =========================================================
  # TGWStaticRoute:
  #   Type: AWS::EC2::TransitGatewayRoute
  #   Properties:
  #     DestinationCidrBlock: 10.2.0.0/16
  #     TransitGatewayRouteTableId: tgw-rtb-서울TGW라우팅테이블ID
  #     TransitGatewayAttachmentId: !Ref SeoulSingaporePeering

Outputs:
  SeoulTransitGatewayID:
    Description: Seoul Transit Gateway ID
    Value: !Ref TransitGateway1

  SeoulTransitGatewayAttachmentID:
    Description: Seoul VPC Attachment ID
    Value: !Ref TransitGatewayAtt1

  SeoulPeeringAttachmentID:
    Description: Seoul to Singapore TGW Peering Attachment ID
    Value: !Ref SeoulSingaporePeering

  SeoulPublicRouteTableID:
    Description: Seoul Public Route Table ID
    Value: !Ref SeoulPublicRT

  SeoulPublicEC2PublicIP:
    Description: Seoul Public EC2 Public IP
    Value: !GetAtt SeoulPublicEC2.PublicIp

  SeoulPublicEC2PrivateIP:
    Description: Seoul Public EC2 Private IP
    Value: !GetAtt SeoulPublicEC2.PrivateIp