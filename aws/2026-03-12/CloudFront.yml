Parameters:

  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: must be the name of an existing EC2 KeyPair.

  LatestAmiTd:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64


  CloudFrontCertificatieArn:
    Description: ACM certificate ARN in us-east-1 for CloudFront viewer (e.g., arn:aws:acm:us-east-1)
    Type: String

Resources:

# =========================
# VPC
# =========================
  SAVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: SA-VPC







# =========================
# Internet Gateway
# =========================
  SA1GW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: SA-1GW

  AttachGateway1:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref SAVPC
      InternetGatewayId: !Ref SA1GW



# =========================
# Subnets
# =========================
  SAPublicSN1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SAVPC
      CidrBlock: 10.0.0.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: SA-Public-SN1

  SAPublicSN2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SAVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: Name
          Value: SA-Public-SN2






# =========================
# Route Tables
# =========================
  SAPublicRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SAVPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway1
    Properties:
      RouteTableId: !Ref SAPublicRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref SA1GW

  PublicSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SAPublicSN1
      RouteTableId: !Ref SAPublicRT

  PublicSubnet1Association2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SAPublicSN2
      RouteTableId: !Ref SAPublicRT





# =========================
# Security Groups
# =========================




  WEBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web SG
      VpcId: !Ref SAVPC
      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          # SourceSecurityGroupId: !Ref ALBSecurityGroup
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0


        - IpProtocol: icmp #ping용
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0







# ec2
  
  SAEC21:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiTd
      KeyName: !Ref KeyName
      SubnetId: !Ref SAPublicSN1
      SecurityGroupIds:
        - !Ref WEBSG
      PrivateIpAddress: 10.0.0.100
      Tags:
        - Key: Name
          Value: SAEC21
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            TOKEN=$(curl -sS -X PUT "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
            RZAZ=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone-id)
            IID=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            LIP=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)              
            wget https://cloudneta.github.io/test.jpg
            wget -P /usr/share/nginx/html/ https://cloudneta.github.io/test.jpg
            dnf install -y nginx
            echo "<head><link rel='icon' href='data:;base64,iVBORw0KGgo='></head><h1>RegionAz($RZAZ) : Instance ID($IID) : Private IP($LIP) : Main Web-Soldesk</h1><img src='test.jpg'>" > /usr/share/nginx/html/index.html
            systemctl start nginx
            systemctl enable nginx



  SAEC22:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiTd
      KeyName: !Ref KeyName
      SubnetId: !Ref SAPublicSN2
      SecurityGroupIds:
        - !Ref WEBSG
      PrivateIpAddress: 10.0.1.100
      Tags:
        - Key: Name
          Value: SAEC22
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            TOKEN=$(curl -sS -X PUT "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
            RZAZ=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone-id)
            IID=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            LIP=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)              
            wget https://cloudneta.github.io/test.jpg
            wget -P /usr/share/nginx/html/ https://cloudneta.github.io/test.jpg
            dnf install -y nginx
            echo "<head><link rel='icon' href='data:;base64,iVBORw0KGgo='></head><h1>RegionAz($RZAZ) : Instance ID($IID) : Private IP($LIP) : Main Web-Soldesk</h1><img src='test.jpg'>" > /usr/share/nginx/html/index.html
            systemctl start nginx
            systemctl enable nginx





  myLaunchTemplate1:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub SoldeskAutoScaling
      VersionDescription: !Sub v1
      LaunchTemplateData:
        NetworkInterfaces:
          - DeviceIndex: 0
            # AssociatePublicIpAddress: true
            Groups:
              - !Ref WEBSG
            DeleteOnTermination: true
        ImageId: !Ref LatestAmiTd
        InstanceType: t3.micro
        KeyName: !Ref KeyName
        UserData:
          Fn::Base64:
            !Sub |
              #!/bin/bash
              TOKEN=$(curl -sS -X PUT "http://169.254.169.254/latest/api/token" \
                -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
              RZAZ=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" \
                http://169.254.169.254/latest/meta-data/placement/availability-zone-id)
              IID=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" \
                http://169.254.169.254/latest/meta-data/instance-id)
              LIP=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" \
                http://169.254.169.254/latest/meta-data/local-ipv4)
              dnf install -y nginx
              wget -P /usr/share/nginx/html/ https://cloudneta.github.io/test.jpg
              echo "<head><link rel='icon' href='data:;base64,iVBORw0KGgo='></head><h1>RegionAz($RZAZ) : Instance ID($IID) : Private IP($LIP) : ASG Web-Soldesk</h1><img src='test.jpg'>" > /usr/share/nginx/html/index.html
              echo "1" > /usr/share/nginx/html/HealthCheck.txt
              systemctl start nginx
              systemctl enable nginx



  # =========================
  # ALB
  # =========================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Name: MyALB
      SecurityGroups:
        - !Ref WEBSG
      Subnets:
        - !Ref SAPublicSN1
        - !Ref SAPublicSN2


  # =========================
  # ALB Target Group
  # =========================
  ALBTG1:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    # DependsOn: WebServer2
    Properties:
      Name: ALBTG1
      Port: 80
      Protocol: HTTP
      VpcId: !Ref SAVPC
      Targets:
        - Id: !Ref SAEC21
          Port: 80
        - Id: !Ref SAEC22
          Port: 80
      Tags:
        - Key: Name
          Value: SA-ALBTG


 

  # =========================
  # ALB Listener
  # =========================
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTG1

# Route53 호스팅영역생성 
  PublicDNS:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: lilysua.cloud
      HostedZoneConfig:
        Comment: Public hosted zone For liilysu.cloud




# ALBAlias
  ALBAlias:
    Type: AWS::Route53::RecordSet
    Properties:
      Name: alb.lilysua.cloud
      Type: A
      HostedZoneId: !Ref PublicDNS
      AliasTarget:
        DNSName: !GetAtt ALB.DNSName
        HostedZoneId: !GetAtt ALB.CanonicalHostedZoneID






# ASG
  ASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: SAASG
      VPCZoneIdentifier:
        - !Ref SAPublicSN1
        - !Ref SAPublicSN2
      Cooldown: 10
      HealthCheckGracePeriod: 120
      HealthCheckType: ELB
      LaunchTemplate:
        LaunchTemplateId: !Ref myLaunchTemplate1
        Version: !GetAtt myLaunchTemplate1.LatestVersionNumber
      MaxSize: 4
      MinSize: 1
      DesiredCapacity: 2
      TargetGroupARNs:
        - !Ref ALBTG1
      Tags:
        - Key: Name
          Value: web-asg
          PropagateAtLaunch: true

    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT2M




# Cloud Front

  CFDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        PriceClass: PriceClass_All
        Aliases:
          - www.lilysua.cloud
        DefaultRootObject: index.html
        Origins:
          - Id: alb-origin
            DomainName: !GetAtt ALB.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: alb-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CacheMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   #Managed-CashingOptimized
          Compress: true
        ViewerCertificate:
          AcmCertificateArn: !Ref CloudFrontCertificatieArn #(us-east-1)
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

#  CloudFront용 Route53 레코드 (cdn.<domain> -> CloudFront)
  CloudFrontAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      Name: www.lilysua.cloud
      Type: A
      HostedZoneId: !Ref PublicDNS
      AliasTarget:
        DNSName: !GetAtt CFDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   #CloudFront 고정 Hosted Zone ID(변경 불가)