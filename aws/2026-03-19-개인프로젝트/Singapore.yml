# =========================
# TGW Route Table - static routes
# =========================
  SingaporeTgwRouteToAwsVpc:
    Type: AWS::EC2::TransitGatewayRoute
    DependsOn: SingaporeAwsVpcAttachmentAssociation
    Properties:
      DestinationCidrBlock: 10.3.0.0/16
      TransitGatewayAttachmentId: !Ref SingaporeAwsVpcAttachment
      TransitGatewayRouteTableId: !Ref SingaporeTGWRouteTable

  SingaporeTgwRouteToIdcVpc:
    Type: AWS::EC2::TransitGatewayRoute
    DependsOn: SingaporeIdcVpnAttachmentAssociation
    Properties:
      DestinationCidrBlock: 10.4.0.0/16
      TransitGatewayAttachmentId: !GetAtt SingaporeIdcVpnConnection.TransitGatewayAttachmentId
      TransitGatewayRouteTableId: !Ref SingaporeTGWRouteTable

# =========================
# IDC Route Entries to CGW ENI
# =========================
  SingaporeCgwEni:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref SingaporeIDCSubnet
      PrivateIpAddress: 10.4.1.11
      GroupSet:
        - !Ref SingaporeCGWSG
      SourceDestCheck: false
      Tags:
        - Key: Name
          Value: SingaporeCgwEni

  SingaporeCgwEniAttach:
    Type: AWS::EC2::NetworkInterfaceAttachment
    Properties:
      DeviceIndex: '1'
      InstanceId: !Ref SINGAPOREIDCCGW
      NetworkInterfaceId: !Ref SingaporeCgwEni

  SingaporeIDCToAWSRoute:
    Type: AWS::EC2::Route
    DependsOn: SingaporeCgwEniAttach
    Properties:
      RouteTableId: !Ref SingaporeIDCRT
      DestinationCidrBlock: 10.3.0.0/16
      NetworkInterfaceId: !Ref SingaporeCgwEni

  SingaporeIDCToAWSSeoulRoute:
    Type: AWS::EC2::Route
    DependsOn: SingaporeCgwEniAttach
    Properties:
      RouteTableId: !Ref SingaporeIDCRT
      DestinationCidrBlock: 10.1.0.0/16
      NetworkInterfaceId: !Ref SingaporeCgwEni

  SingaporeIDCToIDCSeoulRoute:
    Type: AWS::EC2::Route
    DependsOn: SingaporeCgwEniAttach
    Properties:
      RouteTableId: !Ref SingaporeIDCRT
      DestinationCidrBlock: 10.2.0.0/16
      NetworkInterfaceId: !Ref SingaporeCgwEni





Outputs:
#서울 스택 배포할 때 피어링 요청 대상 TGW ID로 사용
  SingaporeTGWId:
    Value: !Ref SingaporeTGW

#싱가포르 static route 업데이트할 때 필요
  SingaporeTGWRouteTableId:
    Value: !Ref SingaporeTGWRouteTable


