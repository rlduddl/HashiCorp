# =========================
# IDC DNS
# =========================
  IDCDNSSRV:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiTd
      KeyName: !Ref KeyName
      SubnetId: !Ref SeoulIDCSubnet
      SecurityGroupIds:
        - !Ref IDCDNSSG
      PrivateIpAddress: 10.2.1.200
      Tags:
        - Key: Name
          Value: IDCDNSSRV
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eux
          hostnamectl --static set-hostname dnssvr
          dnf -y update
          dnf -y install bind bind-utils bind-libs

          sed -i "s/listen-on port 53 { 127.0.0.1; }/listen-on port 53 { any; }/g" /etc/named.conf || true
          sed -i "s/allow-query     { localhost; }/allow-query     { any; }/g" /etc/named.conf || true
          sed -i "s/dnssec-validation yes/dnssec-validation no/g" /etc/named.conf || true

          cat <<EOF >/etc/named.rfc1912.zones
          zone "idcseoul.internal" {
              type master;
              file "/var/named/db.idcseoul.internal";
              allow-update { none; };
          };

          zone "awsseoul.internal" {
              type forward;
              forward only;
              forwarders { 10.1.3.250; 10.1.4.250; };
          };

          zone "awssingapore.internal" {
              type forward;
              forward only;
              forwarders { 10.3.3.250; 10.3.4.250; };
          };

          zone "idcsingapore.internal" {
              type forward;
              forward only;
              forwarders { 10.4.1.200; };
          };
          EOF

          cat <<EOF >/var/named/db.idcseoul.internal
          \$TTL 300
          @   IN  SOA idcseoul.internal. root.idcseoul.internal. (
                  2026032301
                  3600
                  900
                  604800
                  86400
          )
          @           IN  NS  ns1.idcseoul.internal.
          ns1         IN  A   10.2.1.200
          dnssvr      IN  A   10.2.1.200
          dbsvr       IN  A   10.2.1.100
          cgw         IN  A   10.2.1.10
          EOF

          systemctl enable --now named

# =========================
# IDC DB Master (MySQL 8.0)
# =========================
  IDCDBSRV:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiTd
      KeyName: !Ref KeyName
      SubnetId: !Ref SeoulIDCSubnet
      SecurityGroupIds:
        - !Ref IDCDBSG
      PrivateIpAddress: 10.2.1.100
      Tags:
        - Key: Name
          Value: IDCDBSRV
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > >(tee -a /var/log/userdata.log) 2>&1
          set -eux
          hostnamectl set-hostname dbsvr
          dnf -y update
          dnf -y install dnf-plugins-core
          dnf -y install https://dev.mysql.com/get/mysql84-community-release-el9-3.noarch.rpm
          rpm --import https://repo.mysql.com/RPM-GPG-KEY-mysql-2025
          dnf config-manager --disable mysql-8.4-lts-community || true
          dnf config-manager --enable mysql80-community || true
          dnf clean all
          dnf -y install mysql-community-server
          cat <<EOF >/etc/my.cnf.d/replication.cnf
          [mysqld]
          server-id=1
          log_bin=mysql-bin
          binlog_format=ROW
          bind-address=0.0.0.0
          EOF
          systemctl enable mysqld
          systemctl start mysqld

          TEMP_PASS=$(grep 'temporary password' /var/log/mysqld.log | awk '{print $NF}' | tail -1)
          mysql --connect-expired-password -uroot -p"$TEMP_PASS" -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '${MysqlRootPassword}';"

          mysql -uroot -p'${MysqlRootPassword}' -e "CREATE DATABASE IF NOT EXISTS appdb;"
          mysql -uroot -p'${MysqlRootPassword}' -e "CREATE USER IF NOT EXISTS '${MysqlAppUser}'@'10.1.%' IDENTIFIED BY '${MysqlAppPassword}';"
          mysql -uroot -p'${MysqlRootPassword}' -e "GRANT ALL PRIVILEGES ON appdb.* TO '${MysqlAppUser}'@'10.1.%';"
          mysql -uroot -p'${MysqlRootPassword}' -e "CREATE USER IF NOT EXISTS '${MysqlReplUser}'@'10.4.%' IDENTIFIED BY '${MysqlReplPassword}';"
          mysql -uroot -p'${MysqlRootPassword}' -e "GRANT REPLICATION SLAVE ON *.* TO '${MysqlReplUser}'@'10.4.%'; FLUSH PRIVILEGES;"

# =========================
# IDC CGW
# =========================
  SeoulCGWEIP:
    Type: AWS::EC2::EIP
    DependsOn: SeoulIDCAttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: SeoulCGWEIP

  IDCCGW:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      ImageId: ami-06b18c6a9a323f75f
      KeyName: !Ref KeyName
      SubnetId: !Ref SeoulIDCSubnet
      SecurityGroupIds:
        - !Ref CGWSG
      SourceDestCheck: false
      PrivateIpAddress: 10.2.1.10
      Tags:
        - Key: Name
          Value: IDCCGW
      UserData:
        Fn::Base64: !Sub |


  SeoulCGWEIPAssociation:
      Type: AWS::EC2::EIPAssociation
      DependsOn: IDCCGW
      Properties:
        AllocationId: !GetAtt SeoulCGWEIP.AllocationId
        InstanceId: !Ref IDCCGW

# =========================
# TGW / VPN
# =========================
  SeoulTGW:
    Type: AWS::EC2::TransitGateway
    Properties:
      AmazonSideAsn: 64512
      AutoAcceptSharedAttachments: disable
      DefaultRouteTableAssociation: disable
      DefaultRouteTablePropagation: disable
      DnsSupport: enable
      VpnEcmpSupport: enable
      Tags:
        - Key: Name
          Value: SeoulTGW

  SeoulTGWRouteTable:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      TransitGatewayId: !Ref SeoulTGW
      Tags:
        - Key: Name
          Value: SeoulTGWRouteTable

  SeoulAwsVpcAttachment:
    Type: AWS::EC2::TransitGatewayAttachment
    Properties:
      TransitGatewayId: !Ref SeoulTGW
      VpcId: !Ref SeoulVPC
      SubnetIds:
        - !Ref SeoulTGWSubnetA
        - !Ref SeoulTGWSubnetC
      Tags:
        - Key: Name
          Value: SeoulAwsVpcAttachment

  SeoulAwsVpcAttachmentAssociation:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties:
      TransitGatewayAttachmentId: !Ref SeoulAwsVpcAttachment
      TransitGatewayRouteTableId: !Ref SeoulTGWRouteTable

  SeoulAwsVpcAttachmentPropagation:
    Type: AWS::EC2::TransitGatewayRouteTablePropagation
    Properties:
      TransitGatewayAttachmentId: !Ref SeoulAwsVpcAttachment
      TransitGatewayRouteTableId: !Ref SeoulTGWRouteTable

  SeoulCustomerGateway:
    Type: AWS::EC2::CustomerGateway
    Properties:
      BgpAsn: !Ref CgwBgpAsn
      IpAddress: !Ref SeoulCGWEIP
      Type: ipsec.1
      Tags:
        - Key: Name
          Value: SeoulCustomerGateway

  SeoulIdcVpnConnection:
    Type: AWS::EC2::VPNConnection
    Properties:
      Type: ipsec.1
      TransitGatewayId: !Ref SeoulTGW
      CustomerGatewayId: !Ref SeoulCustomerGateway
      VpnTunnelOptionsSpecifications:
        - PreSharedKey: !Ref Tunnel1Psk
          TunnelInsideCidr: !Ref Tunnel1InsideCidr
        - PreSharedKey: !Ref Tunnel2Psk
          TunnelInsideCidr: !Ref Tunnel2InsideCidr
      Tags:
        - Key: Name
          Value: SeoulIdcVpnConnection

