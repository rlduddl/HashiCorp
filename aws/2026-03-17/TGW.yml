Parameters:
  KeyName:
    Description: Existing EC2 KeyPair name for SSH access
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: Must be the name of an existing EC2 KeyPair.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Mappings:
  RegionMap:
    ap-northeast-2:
      AZ1: ap-northeast-2a
      AZ2: ap-northeast-2c

Resources:

# =========================================================
# VPC
# =========================================================
  TGWVPC0:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: TGW-VPC0

  TGWVPC1:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.10.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: TGW-VPC1

  TGWVPC2:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: TGW-VPC2

# =========================================================
# Internet Gateway (VPC0 only)
# =========================================================
  TGWVPC0IGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: TGW-VPC0-IGW

  TGWVPC0IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref TGWVPC0
      InternetGatewayId: !Ref TGWVPC0IGW

# =========================================================
# Subnets - VPC0
# =========================================================
  TGWVPC0Subnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TGWVPC0
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !FindInMap [RegionMap, !Ref "AWS::Region", AZ1]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: TGW-VPC0-Subnet1

  TGWVPC0Subnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TGWVPC0
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !FindInMap [RegionMap, !Ref "AWS::Region", AZ2]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: TGW-VPC0-Subnet2

  TGWVPC0Subnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TGWVPC0
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !FindInMap [RegionMap, !Ref "AWS::Region", AZ1]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TGW-VPC0-Subnet3

  TGWVPC0Subnet4:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TGWVPC0
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !FindInMap [RegionMap, !Ref "AWS::Region", AZ2]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TGW-VPC0-Subnet4

# =========================================================
# Subnets - VPC1
# =========================================================
  TGWVPC1Subnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TGWVPC1
      CidrBlock: 10.10.1.0/24
      AvailabilityZone: !FindInMap [RegionMap, !Ref "AWS::Region", AZ1]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TGW-VPC1-Subnet1

  TGWVPC1Subnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TGWVPC1
      CidrBlock: 10.10.2.0/24
      AvailabilityZone: !FindInMap [RegionMap, !Ref "AWS::Region", AZ2]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TGW-VPC1-Subnet2

  TGWVPC1Subnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TGWVPC1
      CidrBlock: 10.10.3.0/24
      AvailabilityZone: !FindInMap [RegionMap, !Ref "AWS::Region", AZ1]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TGW-VPC1-Subnet3

  TGWVPC1Subnet4:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TGWVPC1
      CidrBlock: 10.10.4.0/24
      AvailabilityZone: !FindInMap [RegionMap, !Ref "AWS::Region", AZ2]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TGW-VPC1-Subnet4

# =========================================================
# Subnets - VPC2
# =========================================================
  TGWVPC2Subnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TGWVPC2
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !FindInMap [RegionMap, !Ref "AWS::Region", AZ1]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TGW-VPC2-Subnet1

  TGWVPC2Subnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TGWVPC2
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !FindInMap [RegionMap, !Ref "AWS::Region", AZ2]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TGW-VPC2-Subnet2

  TGWVPC2Subnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TGWVPC2
      CidrBlock: 10.20.3.0/24
      AvailabilityZone: !FindInMap [RegionMap, !Ref "AWS::Region", AZ1]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TGW-VPC2-Subnet3

  TGWVPC2Subnet4:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TGWVPC2
      CidrBlock: 10.20.4.0/24
      AvailabilityZone: !FindInMap [RegionMap, !Ref "AWS::Region", AZ2]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TGW-VPC2-Subnet4

# =========================================================
# Route Tables - VPC0
# =========================================================
  TGWVPC0PublicRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TGWVPC0
      Tags:
        - Key: Name
          Value: TGW-VPC0-Public-RT

  TGWVPC0DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: TGWVPC0IGWAttachment
    Properties:
      RouteTableId: !Ref TGWVPC0PublicRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref TGWVPC0IGW

  TGWVPC0Subnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TGWVPC0Subnet1
      RouteTableId: !Ref TGWVPC0PublicRT

  TGWVPC0Subnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TGWVPC0Subnet2
      RouteTableId: !Ref TGWVPC0PublicRT

  TGWVPC0AttachRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TGWVPC0
      Tags:
        - Key: Name
          Value: TGW-VPC0-Attach-RT

  TGWVPC0Subnet3RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TGWVPC0Subnet3
      RouteTableId: !Ref TGWVPC0AttachRT

  TGWVPC0Subnet4RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TGWVPC0Subnet4
      RouteTableId: !Ref TGWVPC0AttachRT

# =========================================================
# Route Tables - VPC1
# =========================================================
  TGWVPC1PrivateRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TGWVPC1
      Tags:
        - Key: Name
          Value: TGW-VPC1-Private-RT

  TGWVPC1Subnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TGWVPC1Subnet1
      RouteTableId: !Ref TGWVPC1PrivateRT

  TGWVPC1Subnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TGWVPC1Subnet2
      RouteTableId: !Ref TGWVPC1PrivateRT

  TGWVPC1AttachRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TGWVPC1
      Tags:
        - Key: Name
          Value: TGW-VPC1-Attach-RT

  TGWVPC1Subnet3RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TGWVPC1Subnet3
      RouteTableId: !Ref TGWVPC1AttachRT

  TGWVPC1Subnet4RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TGWVPC1Subnet4
      RouteTableId: !Ref TGWVPC1AttachRT

# =========================================================
# Route Tables - VPC2
# =========================================================
  TGWVPC2PrivateRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TGWVPC2
      Tags:
        - Key: Name
          Value: TGW-VPC2-Private-RT

  TGWVPC2Subnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TGWVPC2Subnet1
      RouteTableId: !Ref TGWVPC2PrivateRT

  TGWVPC2Subnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TGWVPC2Subnet2
      RouteTableId: !Ref TGWVPC2PrivateRT

  TGWVPC2AttachRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TGWVPC2
      Tags:
        - Key: Name
          Value: TGW-VPC2-Attach-RT

  TGWVPC2Subnet3RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TGWVPC2Subnet3
      RouteTableId: !Ref TGWVPC2AttachRT

  TGWVPC2Subnet4RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TGWVPC2Subnet4
      RouteTableId: !Ref TGWVPC2AttachRT

# =========================================================
# Security Groups
# =========================================================
  VPC0InstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for VPC0 proxy/web instance
      VpcId: !Ref TGWVPC0
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3128
          ToPort: 3128
          CidrIp: 0.0.0.0/0
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 10.0.0.0/8
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: TGW-VPC0-Instance-SG

  VPC1InstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for VPC1 instances
      VpcId: !Ref TGWVPC1
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.0.0.0/8
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 10.0.0.0/8
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: TGW-VPC1-Instance-SG

  VPC2InstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for VPC2 instances
      VpcId: !Ref TGWVPC2
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.0.0.0/8
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 10.0.0.0/8
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: TGW-VPC2-Instance-SG

  CloudFormationEndpointSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for CloudFormation Interface Endpoint in VPC0
      VpcId: !Ref TGWVPC0
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: TGW-VPC0-CFN-Endpoint-SG

# =========================================================
# EC2 Instances
# =========================================================
  VPC0Instance1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      SourceDestCheck: false
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref TGWVPC0Subnet1
          GroupSet:
            - !Ref VPC0InstanceSG
          AssociatePublicIpAddress: true
          PrivateIpAddress: 10.0.1.10
      Tags:
        - Key: Name
          Value: VPC0-Instance1
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          hostnamectl --static set-hostname VPC0Instance1
          cat <<'EOT' >> /etc/profile.d/prompt.sh
          export PS1="[\[\e[1;31m\]\u\[\e[m\]@\[\e[1;32m\]\h\[\e[m\]: \[\e[1;36m\]\w\[\e[m\]]#"
          EOT
          source /etc/profile

          dnf install -y tcpdump squid httpd curl

          cat <<'EOT' > /etc/squid/squid.conf
          http_port 3128
          acl all src 0.0.0.0/0
          http_access allow all
          http_access deny all
          EOT

          systemctl enable squid
          systemctl start squid

          cat <<'EOT' > /home/ec2-user/list.txt
          10.0.1.10
          10.10.1.10
          10.10.2.10
          10.20.1.10
          10.20.2.10
          EOT

          systemctl enable httpd
          systemctl start httpd
          echo "<h1>TGW Lab - MgMt Server1</h1>" > /var/www/html/index.html

          curl -o /home/ec2-user/pingall.sh https://cloudneta-book.s3.ap-northeast-2.amazonaws.com/chapter6/pingall.sh --silent
          cp /home/ec2-user/pingall.sh /var/www/html/pingall.sh
          cp /home/ec2-user/list.txt /var/www/html/list.txt
          chmod +x /home/ec2-user/pingall.sh
          chown ec2-user:ec2-user /home/ec2-user/list.txt /home/ec2-user/pingall.sh

  VPC1Instance1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      SubnetId: !Ref TGWVPC1Subnet1
      PrivateIpAddress: 10.10.1.10
      SecurityGroupIds:
        - !Ref VPC1InstanceSG
      Tags:
        - Key: Name
          Value: VPC1-Instance1
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          (
          echo "qwe123"
          echo "qwe123"
          ) | passwd --stdin root
          sed -i "s/^PasswordAuthentication no/PasswordAuthentication yes/g" /etc/ssh/sshd_config
          sed -i "s/^#PermitRootLogin prohibit-password/PermitRootLogin yes/g" /etc/ssh/sshd_config
          systemctl restart sshd

  VPC1Instance2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      SubnetId: !Ref TGWVPC1Subnet2
      PrivateIpAddress: 10.10.2.10
      SecurityGroupIds:
        - !Ref VPC1InstanceSG
      Tags:
        - Key: Name
          Value: VPC1-Instance2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          (
          echo "qwe123"
          echo "qwe123"
          ) | passwd --stdin root
          sed -i "s/^PasswordAuthentication no/PasswordAuthentication yes/g" /etc/ssh/sshd_config
          sed -i "s/^#PermitRootLogin prohibit-password/PermitRootLogin yes/g" /etc/ssh/sshd_config
          systemctl restart sshd

  VPC2Instance1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      SubnetId: !Ref TGWVPC2Subnet1
      PrivateIpAddress: 10.20.1.10
      SecurityGroupIds:
        - !Ref VPC2InstanceSG
      Tags:
        - Key: Name
          Value: VPC2-Instance1
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          (
          echo "qwe123"
          echo "qwe123"
          ) | passwd --stdin root
          sed -i "s/^PasswordAuthentication no/PasswordAuthentication yes/g" /etc/ssh/sshd_config
          sed -i "s/^#PermitRootLogin prohibit-password/PermitRootLogin yes/g" /etc/ssh/sshd_config
          systemctl restart sshd

  VPC2Instance2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      SubnetId: !Ref TGWVPC2Subnet2
      PrivateIpAddress: 10.20.2.10
      SecurityGroupIds:
        - !Ref VPC2InstanceSG
      Tags:
        - Key: Name
          Value: VPC2-Instance2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          (
          echo "qwe123"
          echo "qwe123"
          ) | passwd --stdin root
          sed -i "s/^PasswordAuthentication no/PasswordAuthentication yes/g" /etc/ssh/sshd_config
          sed -i "s/^#PermitRootLogin prohibit-password/PermitRootLogin yes/g" /etc/ssh/sshd_config
          systemctl restart sshd

# =========================================================
# VPC Endpoint - CloudFormation (VPC0 only)
# =========================================================
  CloudFormationVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref TGWVPC0
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.cloudformation
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref TGWVPC0Subnet1
        - !Ref TGWVPC0Subnet2
      SecurityGroupIds:
        - !Ref CloudFormationEndpointSG
      Tags:
        - Key: Name
          Value: TGW-VPC0-CloudFormation-Endpoint







#TGW Resource
  TransitGateway1:
    Type: AWS::EC2::TransitGateway
    Properties:
      DefaultRouteTableAssociation: disable
      DefaultRouteTablePropagation: disable
      Tags:
        - Key: Name
          Value: TGW1

  TransitGatewayAtt1:
    Type: AWS::EC2::TransitGatewayAttachment
    DependsOn: TGWVPC0
    Properties:
      VpcId: !Ref TGWVPC0
      SubnetIds:
        - !Ref TGWVPC0Subnet3
        - !Ref TGWVPC0Subnet4
      TransitGatewayId: !Ref TransitGateway1
      Tags:
        - Key: Name
          Value: TGW1-ATT1-VPC0



  TransitGatewayAtt2:
    Type: AWS::EC2::TransitGatewayAttachment
    DependsOn: TGWVPC1
    Properties:
      VpcId: !Ref TGWVPC1
      SubnetIds:
        - !Ref TGWVPC1Subnet3
        - !Ref TGWVPC1Subnet4
      TransitGatewayId: !Ref TransitGateway1
      Tags:
        - Key: Name
          Value: TGW1-ATT1-VPC1


  TransitGatewayAtt3:
    Type: AWS::EC2::TransitGatewayAttachment
    DependsOn: TGWVPC2
    Properties:
      VpcId: !Ref TGWVPC2
      SubnetIds:
        - !Ref TGWVPC2Subnet3
        - !Ref TGWVPC2Subnet4
      TransitGatewayId: !Ref TransitGateway1
      Tags:
        - Key: Name
          Value: TGW1-ATT1-VPC2


  VPC0Route2:
    Type: AWS::EC2::Route
    DependsOn: TransitGatewayAtt1
    Properties:
      RouteTableId: !Ref TGWVPC0PublicRT
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway1

  VPC1Route2:
    Type: AWS::EC2::Route
    DependsOn: TransitGatewayAtt2
    Properties:
      RouteTableId: !Ref TGWVPC1PrivateRT
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway1


  VPC2Route2:
    Type: AWS::EC2::Route
    DependsOn: TransitGatewayAtt3
    Properties:
      RouteTableId: !Ref TGWVPC2PrivateRT
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway1




# TGW 라우팅테이블1 생성
  TransitGatewayRT1:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      TransitGatewayId: !Ref TransitGateway1
      Tags:
        - Key: Name
          Value: TGW1-RT1

